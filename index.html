<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="暮らしTODO">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <title>わたしの暮らしTODO</title>
</head>
<body>
  <div id="error-bar"></div>
  <header id="topbar"><div class="app-name">わたしの暮らしTODO</div><h1>読み込み中…</h1></header>
  <main id="view"><p class="empty">読み込み中…</p></main>
  <nav id="tabbar" aria-label="画面の切り替え">
    <button type="button" data-action="tab" data-tab="today" class="on"><span class="ti">☀️</span>今日</button>
    <button type="button" data-action="tab" data-tab="routines"><span class="ti">🔁</span>ルーティン</button>
    <button type="button" data-action="tab" data-tab="all"><span class="ti">📋</span>すべて</button>
    <button type="button" data-action="tab" data-tab="calendar"><span class="ti">📅</span>カレンダー</button>
    <button type="button" data-action="tab" data-tab="settings"><span class="ti">⚙️</span>設定</button>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p class="fatal">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
  <script>
    // 本体が読み込めなかったときの表示（古いiOSなど）
    setTimeout(function () {
      if (!window.__appStarted) {
        document.getElementById('view').innerHTML = '<div class="fatal"><h2>⚠️ アプリを読み込めませんでした</h2><p>電波の良い場所で開き直してください。iOSが古い場合は、iOSのアップデートが必要なことがあります。</p><button type="button" onclick="location.reload()">再読み込み</button></div>';
      }
    }, 10000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
